plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.youtubetvgecko"

    compileSdk 35

    defaultConfig {
        applicationId "com.example.youtubetvgecko"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {

    implementation "androidx.appcompat:appcompat:1.6.1"

    implementation(name: "geckoview", ext: "aar")
}
