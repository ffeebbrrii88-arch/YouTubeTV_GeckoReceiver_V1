plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.youtubetvgecko"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.youtubetvgecko"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"

    // GeckoView
    implementation "org.mozilla.geckoview:geckoview:120.0.20231120154615"
}
